<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1281" width="1000" height="1281" role="img">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/></marker></defs>
<rect width="1000" height="1281" fill="#ffffff"/>
<text x="32" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328" text-anchor="start">A charge you start — launch() to result</text>
<text x="32" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">One suspend call. Everything between it and the result is the SDK’s.</text>
<rect x="80.0" y="112" width="440" height="84.0" rx="12" fill="#fff4e8" stroke="#f0a259" stroke-width="1.5"/>
<text x="94.0" y="137.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="400" fill="#f57500" text-anchor="start">HaloSdkUi.launch(amount, merchantRef, currency,</text>
<text x="94.0" y="156.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="400" fill="#f57500" text-anchor="start">presentation)</text>
<text x="94.0" y="177.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Full-screen by default, or this charge as a sheet over your app.</text>
<path d="M 300 199.0 L 300 215.0" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M 300 220.0 L 445.0 266.0 L 300 312.0 L 155.0 266.0 Z" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5" stroke-linejoin="round"/>
<text x="300" y="270.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#4d3800" text-anchor="middle">amount null or zero?</text>
<path d="M 445 266.0 L 554 266.0" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="486.3425" y="241.0" width="32.315" height="20" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
<text x="502.5" y="255.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle">yes</text>
<rect x="560" y="224.0" width="412" height="81.5" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<text x="574" y="249.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Keypad</text>
<text x="574" y="271.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">The merchant types the amount, and a reference if you passed</text>
<text x="574" y="287.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">none.</text>
<path d="M 766.0 308.5 V 346.0 H 300 V 368.0" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="286.895" y="318.0" width="26.21" height="20" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
<text x="300" y="332.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle">no</text>
<rect x="80.0" y="374.0" width="440" height="113.5" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<text x="94.0" y="399.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Tap card</text>
<text x="94.0" y="421.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">The scheme animation, the NFC prompt, and the amount the</text>
<text x="94.0" y="437.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">cardholder is agreeing to.</text>
<text x="94.0" y="453.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Cancelling always confirms first — an accidental swipe never</text>
<text x="94.0" y="469.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">aborts a live card read.</text>
<path d="M 300 490.5 L 300 506.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="80.0" y="511.5" width="440" height="81.5" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<text x="94.0" y="537.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Card read → the PIN pad, if the card asks for it</text>
<text x="94.0" y="558.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">The payment kernel’s own PIN screen. The SDK declares its theme on</text>
<text x="94.0" y="574.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">your behalf.</text>
<path d="M 300 596.0 L 300 612.0" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M 300 617.0 L 445.0 663.0 L 300 709.0 L 155.0 663.0 Z" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5" stroke-linejoin="round"/>
<text x="300" y="667.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#4d3800" text-anchor="middle">DCC enabled?</text>
<path d="M 445 663.0 L 554 663.0" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="486.3425" y="638.0" width="32.315" height="20" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
<text x="502.5" y="652.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle">yes</text>
<rect x="560" y="609.0" width="412" height="113.5" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="574" y="634.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">The cardholder picks a currency</text>
<text x="574" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">The local and the card currency, with the rate and the margin</text>
<text x="574" y="672.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">shown.</text>
<text x="574" y="688.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Not yet exposed — HDConfig.showDCC is commented out while the</text>
<text x="574" y="704.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">flow is reworked.</text>
<path d="M 766.0 725.5 V 743.0 H 300 V 765.0" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="286.895" y="715.0" width="26.21" height="20" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
<text x="300" y="729.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle">no</text>
<rect x="80.0" y="771.0" width="440" height="43.5" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<text x="94.0" y="796.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">The kernel processes the charge</text>
<path d="M 300 817.5 L 300 833.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M 300 838.5 L 455.0 884.5 L 300 930.5 L 145.0 884.5 Z" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5" stroke-linejoin="round"/>
<text x="300" y="888.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#4d3800" text-anchor="middle">showTransactionResult?</text>
<path d="M 455 884.5 L 554 884.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="485.2375" y="859.5" width="44.525000000000006" height="20" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
<text x="507.5" y="873.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle">false</text>
<rect x="560" y="830.5" width="412" height="81.5" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<text x="574" y="856.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Your own UI shows the outcome</text>
<text x="574" y="877.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">launch() returns the moment the transaction completes — the</text>
<text x="574" y="893.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">outcome, and the receipt, are yours to present.</text>
<path d="M 300 932.5 L 300 970.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="238.055" y="938.5" width="123.89000000000001" height="20" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
<text x="300" y="952.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle">true — the default</text>
<rect x="80.0" y="974.5" width="440" height="145.5" rx="12" fill="#e9f7ee" stroke="#7ed492" stroke-width="1.5"/>
<text x="94.0" y="1000.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1a7f37" text-anchor="start">The SDK’s own result screen</text>
<text x="94.0" y="1021.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Approved or declined, with the transaction’s own details.</text>
<text x="94.0" y="1037.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Send receipt — an email address, a mobile number, or both. The</text>
<text x="94.0" y="1053.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">kernel sends it, one request per channel, and the screen confirms</text>
<text x="94.0" y="1069.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">it has gone.</text>
<text x="94.0" y="1085.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">A receipt QR code, whenever the kernel returns one.</text>
<text x="94.0" y="1101.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Returns once the merchant dismisses it.</text>
<path d="M 300 1123.0 L 300 1145.0" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="80.0" y="1150.0" width="480" height="97.5" rx="12" fill="#fff4e8" stroke="#f0a259" stroke-width="1.5"/>
<text x="94.0" y="1175.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="400" fill="#f57500" text-anchor="start">HaloTransactionResult?</text>
<text x="94.0" y="1197.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">resultType — Approved · Declined · Cancelled · CardTapTimeOutExpired ·</text>
<text x="94.0" y="1213.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">NetworkError · ProcessingError</text>
<text x="94.0" y="1229.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">plus the transaction references and, for a completed charge, the receipt.</text>
<path d="M 766.0 915.0 V 1128.0 H 460.0 V 1146.0" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
</svg>
